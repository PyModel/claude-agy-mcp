<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Gemini 3.7 Flash Coding Benchmarks">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#10141f"/>
    </linearGradient>

    <radialGradient id="radialAmber" cx="20%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="benchCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0e111a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="benchCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Card Accents -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="benchShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1280" height="360" rx="20" fill="url(#bgBench)"/>
  <rect width="1280" height="360" rx="20" fill="url(#radialAmber)"/>

  <!-- Top Title & Badge Group -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="280" height="22" rx="11" fill="#1c1913" stroke="#d97706" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="11" cy="11" r="3.5" fill="#f59e0b"/>
    <text x="22" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1px" fill="#fbbf24">GOOGLE DEEPMIND · GEMINI 3.7 FLASH</text>
    
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Google's Flagship Coding &amp; Reasoning Workhorse</text>
    <text x="0" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#8492a6">Engineered for long-horizon repository execution, multi-step terminal planning, and context-free Claude delegation.</text>
  </g>

  <!-- 4 Benchmark Metric Cards -->
  <g transform="translate(60, 142)" filter="url(#benchShadow)">
    
    <!-- CARD 1: DeepSWE v1.1 -->
    <g transform="translate(0, 0)">
      <rect width="272" height="176" rx="14" fill="url(#benchCardBg)" stroke="url(#benchCardBorder)" stroke-width="1.2"/>
      <rect x="18" y="16" width="94" height="20" rx="6" fill="#062e24" stroke="#047857" stroke-width="1"/>
      <text x="26" y="30" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#34d399">DeepSWE v1.1</text>
      
      <text x="18" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#34d399" letter-spacing="-1px">65.3%</text>
      
      <!-- Progress Track -->
      <rect x="18" y="102" width="236" height="4" rx="2" fill="#1e293b"/>
      <rect x="18" y="102" width="154" height="4" rx="2" fill="url(#emeraldGrad)"/>
      
      <text x="18" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">▲ +16.3% <tspan fill="#64748b" font-weight="400">vs 3.6 Flash (49.0%)</tspan></text>
      <text x="18" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8492a6">Repository-level issue resolution</text>
    </g>

    <!-- CARD 2: Terminal-Bench 2.1 -->
    <g transform="translate(296, 0)">
      <rect width="272" height="176" rx="14" fill="url(#benchCardBg)" stroke="url(#benchCardBorder)" stroke-width="1.2"/>
      <rect x="18" y="16" width="138" height="20" rx="6" fill="#0c2d48" stroke="#0369a1" stroke-width="1"/>
      <text x="26" y="30" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#38bdf8">Terminal-Bench 2.1</text>
      
      <text x="18" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#38bdf8" letter-spacing="-1px">85.8%</text>
      
      <!-- Progress Track -->
      <rect x="18" y="102" width="236" height="4" rx="2" fill="#1e293b"/>
      <rect x="18" y="102" width="202" height="4" rx="2" fill="url(#cyanGrad)"/>
      
      <text x="18" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">▲ +7.8% <tspan fill="#64748b" font-weight="400">vs 3.6 Flash (78.0%)</tspan></text>
      <text x="18" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8492a6">Agentic CLI &amp; command execution</text>
    </g>

    <!-- CARD 3: WebDev Arena -->
    <g transform="translate(592, 0)">
      <rect width="272" height="176" rx="14" fill="url(#benchCardBg)" stroke="url(#benchCardBorder)" stroke-width="1.2"/>
      <rect x="18" y="16" width="112" height="20" rx="6" fill="#382109" stroke="#b45309" stroke-width="1"/>
      <text x="26" y="30" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#fbbf24">WebDev Arena</text>
      
      <text x="18" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#fbbf24" letter-spacing="-1px">1588 <tspan font-size="20" font-weight="600">Elo</tspan></text>
      
      <!-- Progress Track -->
      <rect x="18" y="102" width="236" height="4" rx="2" fill="#1e293b"/>
      <rect x="18" y="102" width="225" height="4" rx="2" fill="url(#goldGrad)"/>
      
      <text x="18" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">#1 Leaderboard Rank <tspan fill="#64748b" font-weight="400">(vs 1538)</tspan></text>
      <text x="18" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8492a6">Fullstack app &amp; UI synthesis</text>
    </g>

    <!-- CARD 4: Token Economics & Context -->
    <g transform="translate(888, 0)">
      <rect width="272" height="176" rx="14" fill="url(#benchCardBg)" stroke="url(#benchCardBorder)" stroke-width="1.2"/>
      <rect x="18" y="16" width="128" height="20" rx="6" fill="#29144d" stroke="#6d28d9" stroke-width="1"/>
      <text x="26" y="30" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#c084fc">AutomationBench</text>
      
      <text x="18" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#c084fc" letter-spacing="-1px">30.4%</text>
      
      <!-- Progress Track -->
      <rect x="18" y="102" width="236" height="4" rx="2" fill="#1e293b"/>
      <rect x="18" y="102" width="180" height="4" rx="2" fill="url(#purpleGrad)"/>
      
      <text x="18" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c084fc">▲ Ahead of Sonnet 5 <tspan fill="#64748b" font-weight="400">(10.7%)</tspan></text>
      <text x="18" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8492a6">Multi-step enterprise workflows</text>
    </g>

  </g>
</svg>
