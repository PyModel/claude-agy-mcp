<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="claude-agy-mcp banner — Claude Code delegation to Gemini 3.7 Flash">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#10141f"/>
    </linearGradient>
    
    <radialGradient id="glowTop" cx="30%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#e0a83c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>

    <!-- UI Component Gradients -->
    <linearGradient id="brandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#e0a83c"/>
      <stop offset="100%" stop-color="#c2703a"/>
    </linearGradient>

    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#374151" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0a83c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e0a83c" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="460" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="20" fill="url(#glowTop)"/>
  <rect width="1280" height="460" rx="20" fill="url(#glowRight)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="460"/>
    <line x1="240" y1="0" x2="240" y2="460"/>
    <line x1="400" y1="0" x2="400" y2="460"/>
    <line x1="560" y1="0" x2="560" y2="460"/>
    <line x1="720" y1="0" x2="720" y2="460"/>
    <line x1="880" y1="0" x2="880" y2="460"/>
    <line x1="1040" y1="0" x2="1040" y2="460"/>
    <line x1="1200" y1="0" x2="1200" y2="460"/>
  </g>

  <!-- TOP BRANDING ROW -->
  <g transform="translate(80, 52)">
    <!-- Logo Icon (Bridge Motif) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="8" width="6" height="28" rx="3" fill="url(#brandGold)"/>
      <rect x="38" y="8" width="6" height="28" rx="3" fill="url(#brandGold)"/>
      <path d="M3 14 Q22 -4 41 14" fill="none" stroke="url(#brandGold)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="22" cy="4" r="5" fill="#f59e0b" filter="url(#subtleGlow)"/>
    </g>

    <!-- Wordmark -->
    <text x="62" y="30" font-family="ui-monospace, 'SF Mono', Monaco, 'Cascadia Code', Menlo, monospace" font-size="28" font-weight="700" letter-spacing="-0.5px" fill="#ffffff">claude-agy-mcp</text>

    <!-- Pill Tag: Version / Protocol -->
    <rect x="310" y="11" width="68" height="24" rx="12" fill="#1e2430" stroke="#333c4d" stroke-width="1"/>
    <text x="344" y="27" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#9ca3af">v2.0.0</text>

    <!-- Model Feature Badge -->
    <rect x="388" y="11" width="226" height="24" rx="12" fill="#1c1913" stroke="url(#badgeBorder)" stroke-width="1"/>
    <circle cx="400" cy="23" r="3.5" fill="#10b981"/>
    <text x="410" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Default: Gemini 3.7 Flash (High)</text>

    <!-- Headline and Sub-headline -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#f3f4f6">Claude Code delegates heavy coding tasks to Google's Antigravity CLI</text>
    <text x="0" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8492a6">Context-free file analysis, git archaeology, and adversarial code reviews with quota-aware failover.</text>
  </g>

  <!-- TERMINAL WINDOW CARD -->
  <g transform="translate(80, 182)" filter="url(#cardShadow)">
    <!-- Window Frame -->
    <rect width="1120" height="228" rx="14" fill="url(#terminalBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
    
    <!-- Title Bar -->
    <rect width="1120" height="42" rx="14" fill="#171b26"/>
    <!-- Overlap mask to keep bottom corners square -->
    <rect y="28" width="1120" height="14" fill="#171b26"/>
    <line x1="0" y1="42" x2="1120" y2="42" stroke="#252d3d" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="44" cy="21" r="5.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="64" cy="21" r="5.5" fill="#10b981" opacity="0.85"/>

    <!-- Window Title -->
    <text x="560" y="26" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#64748b">claude-code — delegation session [agy bridge]</text>

    <!-- Right Header Badges -->
    <g transform="translate(930, 11)">
      <rect width="168" height="20" rx="10" fill="#0d1117" stroke="#232d3f" stroke-width="1"/>
      <circle cx="12" cy="10" r="3" fill="#10b981"/>
      <text x="22" y="14" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#94a3b8">failover ready · quota ok</text>
    </g>

    <!-- Terminal Content Lines -->
    <g transform="translate(28, 70)" font-family="ui-monospace, 'SF Mono', Monaco, Menlo, monospace" font-size="14.5">
      <!-- Line 1: Command Initiation -->
      <g>
        <text x="0" y="0" fill="#fbbf24" font-weight="700">❯</text>
        <text x="18" y="0" fill="#e2e8f0" font-weight="600">analyze_files</text>
        <text x="145" y="0" fill="#64748b">[</text>
        <text x="155" y="0" fill="#93c5fd">"src/server.ts"</text>
        <text x="280" y="0" fill="#64748b">,</text>
        <text x="295" y="0" fill="#93c5fd">"src/runner.ts"</text>
        <text x="420" y="0" fill="#64748b">,</text>
        <text x="435" y="0" fill="#93c5fd">"src/models.ts"</text>
        <text x="555" y="0" fill="#64748b">]</text>
        <text x="640" y="0" fill="#475569">· 14 files, 4,200 lines (bypasses Claude context)</text>
      </g>

      <!-- Line 2: Route execution -->
      <g transform="translate(18, 30)">
        <text x="0" y="0" fill="#64748b">↳</text>
        <text x="18" y="0" fill="#94a3b8">routed to</text>
        <rect x="90" y="-14" width="186" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="98" y="0" fill="#38bdf8" font-weight="600">Gemini 3.7 Flash (High)</text>
        <text x="290" y="0" fill="#64748b">via agy CLI</text>
        <text x="390" y="0" fill="#34d399">✓ 65.3% DeepSWE</text>
        <text x="525" y="0" fill="#64748b">· 42s cold start</text>
      </g>

      <!-- Line 3: Result Summary -->
      <g transform="translate(18, 62)">
        <text x="0" y="0" fill="#64748b">↳</text>
        <text x="18" y="0" fill="#10b981" font-weight="600">completed</text>
        <text x="105" y="0" fill="#cbd5e1">Identified 3 edge cases, ranked by severity with file:line citations</text>
      </g>

      <!-- Divider line in card -->
      <line x1="-8" y1="84" x2="1070" y2="84" stroke="#1e2638" stroke-width="1"/>

      <!-- Line 4: Response Footer -->
      <g transform="translate(0, 108)">
        <text x="0" y="0" fill="#475569">[</text>
        <text x="8" y="0" fill="#f59e0b" font-weight="600">claude-agy-mcp</text>
        <text x="128" y="0" fill="#475569">]</text>
        <text x="142" y="0" fill="#94a3b8">model:</text>
        <text x="195" y="0" fill="#e2e8f0" font-weight="500">Gemini 3.7 Flash (High)</text>
        <text x="390" y="0" fill="#475569">|</text>
        <text x="408" y="0" fill="#94a3b8">session:</text>
        <text x="475" y="0" fill="#a5b4fc">1f0c4a…9d</text>
        <text x="575" y="0" fill="#64748b">(use follow_up to continue with 0 context overhead)</text>
      </g>
    </g>
  </g>
</svg>
